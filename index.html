<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#FFFFF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦷%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#FFFFF9;
  --gold:#E9C564;
  --gold-ink:#8a6508;
  --silver:#6f7b88;
  --ink:#1d1d1f;
  --card-bg:rgba(255,255,249,.45);
  --card-border:rgba(255,255,255,.35);
  --btn-main:#1d1d1f;
  --btn-main-text:#FFFFF9;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#000;
    --gold-ink:#E9C564;
    --silver:#9CA6B2;
    --ink:#f5f5f7;
    --card-bg:rgba(20,20,22,.42);
    --card-border:rgba(255,255,255,.15);
    --btn-main:#f5f5f7;
    --btn-main-text:#1d1d1f;
  }
}

/* Tarjetas translúcidas */
html.has-bg{--card-bg:rgba(25,25,28,.38)}

@media (prefers-color-scheme:light){
  html.has-bg{--card-bg:rgba(255,255,255,.42)}
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  background:var(--bg);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Figtree','Segoe UI',Roboto,system-ui,sans-serif;
  background:transparent;
  color:var(--ink);
  padding:calc(var(--safe-t) + 0px) 16px calc(var(--safe-b) + 32px);
  line-height:1.4;
  position:relative;
  z-index:1;
}

/* Fondo interactivo */
.bg{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
  pointer-events:none;
}

.bg-move{
  position:absolute;
  left:-10%;
  right:-10%;
  top:-5%;
  height:135%;
  opacity:var(--bg-opacity,1);
  transition:opacity 1s ease;
  will-change:transform;
}

.bg-zoom{
  position:absolute;
  inset:0;
  background-image:var(--bg-img,radial-gradient(60% 38% at 12% 0%,rgba(233,197,100,.30),transparent 70%));
  background-size:cover;
  background-position:50% 12%;
  transform-origin:50% 12%;
  animation:breathe 22s ease-in-out infinite alternate;
}

@keyframes breathe{
  from{transform:scale(1)}
  to{transform:scale(1.08)}
}

main{
  max-width:440px;
  margin:0 auto;
  display:grid;
  gap:16px;
}

svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none;
}

a,button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

:focus-visible{
  outline:2px solid var(--gold-ink);
  outline-offset:2px;
}

.vh{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
}

/* Efecto cristal */
.glass{
  background:var(--card-bg);
  backdrop-filter:blur(32px) saturate(210%);
  -webkit-backdrop-filter:blur(32px) saturate(210%);
  border:1px solid var(--card-border);
  border-radius:28px;
  box-shadow:0 4px 30px rgba(0,0,0,.15), 0 1px 0 rgba(255,255,255,.4) inset;
}

.logo-container{
  display:flex;
  justify-content:center;
  padding:0 10px;
  margin-top:-90px;
  margin-bottom:-120px;
}

.logo-container img{
  width:100%;
  max-width:320px;
  height:auto;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.15));
}

.logo-txt{
  display:none;
  font-size:26px;
  font-weight:800;
  text-align:center;
  letter-spacing:-.4px;
}

.nologo img{display:none}
.nologo .logo-txt{display:block}

header{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:16px 24px;
}

.doctor{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

.cop{
  font-size:14px;
  font-weight:600;
  color:var(--silver);
  margin-top:4px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  font-size:13px;
  font-weight:700;
  background:rgba(233,197,100,.2);
  color:var(--gold-ink);
  padding:6px 14px;
  border-radius:99px;
  border:1px solid rgba(233,197,100,.4);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--gold);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  70%{box-shadow:0 0 0 6px rgba(233,197,100,0)}
  0%{box-shadow:0 0 0 0 rgba(233,197,100,.6)}
  100%{box-shadow:0 0 0 0 rgba(233,197,100,0)}
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-radius:20px;
  padding:16px 12px;
  font-weight:600;
  font-size:15px;
  text-decoration:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .15s;
}

.btn:active{
  transform:scale(.96);
  opacity:.8;
}

.btn.main{
  background:var(--btn-main);
  color:var(--btn-main-text);
  border:none;
  border-radius:99px;
  padding:18px;
  font-size:16px;
  font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
}

.wa{
  background:#1f9d4a;
  color:#fff;
  border:none;
  font-size:16px;
  font-weight:700;
  padding:18px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.grid3 .btn{
  flex-direction:column;
  gap:6px;
  padding:14px 6px;
  font-size:13px;
}

.grid3 .btn svg{color:var(--gold-ink)}

.btn.web{
  padding:16px 20px;
  border-color:rgba(233,197,100,.55);
}

.btn.web svg{color:var(--gold-ink)}
.btn.web span{flex:1;text-align:center}

.panel{padding:24px}

.panel h3{
  font-size:14px;
  font-weight:700;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--silver);
  text-transform:uppercase;
  letter-spacing:.5px;
}

.panel p{
  font-size:15px;
  font-weight:500;
  line-height:1.5;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.chip{
  border:0;
  border-radius:99px;
  padding:9px 16px;
  font-size:14px;
  font-weight:600;
  background:rgba(233,197,100,.25);
  color:var(--ink);
}

.location-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--card-border);
}

.location-item:first-child{padding-top:0}
.location-item:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.location-text b{
  display:block;
  font-size:15px;
  margin-bottom:2px;
}

.location-text span{
  font-size:14px;
  color:var(--silver);
}

.btn-mini{
  padding:9px 15px;
  font-size:13px;
  font-weight:700;
  border-radius:99px;
  text-decoration:none;
  background:rgba(233,197,100,.2);
  color:var(--gold-ink);
  border:1px solid rgba(233,197,100,.4);
  white-space:nowrap;
}

.review{
  padding:28px 24px;
  text-align:center;
}

.review h2{
  font-size:19px;
  font-weight:700;
  letter-spacing:-.3px;
}

.review p{
  color:var(--silver);
  font-size:14px;
  margin-top:6px;
}

.stars{
  display:flex;
  justify-content:center;
  gap:6px;
  margin:20px 0 8px;
}

.stars button{
  background:none;
  border:0;
  padding:4px;
  color:var(--card-border);
}

.stars svg{
  width:40px;
  height:40px;
  fill:currentColor;
  stroke:none;
  transition:transform .2s,color .2s;
}

.stars button.on{color:var(--gold)}

.stars button.on svg{
  transform:scale(1.15);
  filter:drop-shadow(0 2px 8px rgba(233,197,100,.5));
}

.hint{
  min-height:22px;
  font-weight:600;
  font-size:14px;
  color:var(--gold-ink);
}

.hint a{
  display:inline-block;
  margin-top:6px;
  text-decoration:underline;
}

footer{
  text-align:center;
  font-size:13px;
  padding:10px;
  color:var(--silver);
}

footer a{
  color:inherit;
  text-decoration:none;
  font-weight:600;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(var(--safe-b) + 32px);
  transform:translate(-50%,20px);
  background:rgba(29,29,31,.92);
  color:#fff;
  padding:14px 24px;
  border-radius:99px;
  font-size:14px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:99;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.rv{
  animation:in .5s ease backwards;
  animation-delay:calc(var(--i) * 70ms);
}

@keyframes in{
  from{opacity:0;transform:translateY(10px)}
}

@media (prefers-reduced-motion:reduce){
  *{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<div class="bg" aria-hidden="true">
  <div class="bg-move" id="bgMove">
    <div class="bg-zoom"></div>
  </div>
</div>

<main id="app" aria-live="polite"></main>

<script>

const CONFIG = {

  logo: "logo.svg",

  /* FONDO */
  fondoImagen: "Fondo.png",
  fondoOpacidad: "0.5",
  fondoX: 50,
  fondoY: 15,

  telefono: "+51961626778",
  whatsapp: "51961626778",

  mensajeWhatsapp: "Hola Dr. Manuel, quisiera agendar una consulta odontológica.",

  resenaUrl: "https://www.google.com/search?hl=es-PE&gl=pe&q=Centro+Odontol%C3%B3gico+Ausejo,+Jr.+Bellido+227,+Ayacucho+05003&ludocid=6676062512653286504&lsig=AB86z5Xp2VC-tHBRcf5KHV_3goQR#lrd=0x9112870031f4afdf:0x5ca6237be5003c68,3",

  webUrl: "https://centroodontologicoausejo.framer.website",

  webTexto: "Página web del Centro Odontológico",

  locales: [

    {
      nombre: "Sede Independencia",
      direccion: "Av. Independencia Nº 355, Ayacucho",

    },

    {

      direccion: "Jr. Bellido Nº 277, Ayacucho",
      mapaUrl: "https://share.google/BXWKK8myO3wqLt4vn"
    }

  ],

  servicios: [
    "Sedación en niños",

    "Prótesis dentales",

  ],

  /* CRÉDITOS DEL DESARROLLADOR */
  creditos: {
    texto: "Diseñado y desarrollado por Fredy Lonazco © 2026",
    url: "https://www.instagram.com/fredychor/"
  }

};


const I = {

  user:'<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>',

  wa:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>',

  tel:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',

  pin:'<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',

  share:'<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',

  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',

  globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',

  out:'<svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg>',

  star:'<svg viewBox="0 0 24 24"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/></svg>'

};


const c = CONFIG;
const root = document.documentElement;

const esc = s => String(s).replace(/[&<>"']/g, m => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[m]));

const vc = s => String(s || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);


const q = new URLSearchParams(location.search);

const fx = clamp(Number(q.get("x") ?? c.fondoX) || 0, 0, 100);
const fy = clamp(Number(q.get("y") ?? c.fondoY) || 0, 0, 100);

root.style.setProperty("--bg-pos", `${fx}% ${fy}%`);


const move = document.getElementById("bgMove");

if (c.fondoImagen) {

  move.style.opacity = 0;

  const url = c.fondoImagen.replace(/"/g, "");

  const probe = new Image();

  probe.onload = () => {

    root.style.setProperty("--bg-img", `url("${url}")`);

    root.classList.add("has-bg");

    move.style.opacity = c.fondoOpacidad;

  };

  probe.onerror = () => {
    move.style.opacity = 1;
  };

  probe.src = url;

}


document.title = `${c.nombreNegocio} - ${c.doctor}`;


const ld = document.createElement("script");

ld.type = "application/ld+json";

ld.textContent = JSON.stringify({

  "@context": "https://schema.org",
  "@type": "Dentist",
  name: c.nombreNegocio,
  telephone: c.telefono,

  address: c.locales.map(l => ({
    "@type": "PostalAddress",
    streetAddress: l.direccion,
    addressCountry: "PE"
  }))

});

document.head.appendChild(ld);


function render() {

  const wa = `https://wa.me/${c.whatsapp}?text=${encodeURIComponent(c.mensajeWhatsapp)}`;

  const app = document.getElementById("app");


  app.innerHTML = `

  <div class="logo-container">

    <img src="${esc(c.logo)}" alt="${esc(c.nombreNegocio)}" onerror="this.parentNode.classList.add('nologo')">

    <p class="logo-txt">${esc(c.nombreNegocio)}</p>

  </div>


  <header class="glass">

    <h1 class="vh">${esc(c.nombreNegocio)}</h1>

    <p class="doctor">${esc(c.doctor)}</p>

    <span class="cop">${esc(c.colegiatura)}</span>

    <span class="badge"><span class="dot"></span>${esc(c.horarioTexto)}</span>

  </header>


  <button class="btn main" id="guardar">${I.user}Guardar contacto</button>

  <a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">${I.wa}Agendar cita por WhatsApp</a>


  <div class="grid3">

    <a class="btn" href="tel:${esc(c.telefono)}">${I.tel}Llamar</a>

    <a class="btn" href="#locales">${I.pin}Locales</a>

    <button class="btn" id="compartir">${I.share}Compartir</button>

  </div>


  <a class="btn web" href="${esc(c.webUrl)}" target="_blank" rel="noopener">${I.globe}<span>${esc(c.webTexto)}</span>${I.out}</a>


  <section class="panel glass">

    <h3>${I.clock}Disponibilidad</h3>

    <p>Atención odontológica previa cita o emergencias las 24 horas del día, los 7 días de la semana.</p>

  </section>


  <section class="panel glass">

    <h3>Tratamientos y especialidades</h3>

    <div class="chips">${c.servicios.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>

  </section>


  <section class="panel glass" id="locales">

    <h3>${I.pin}Nuestros locales</h3>

    <div>${c.locales.map(l => `

      <div class="location-item">

        <div class="location-text">

          <b>${esc(l.nombre)}</b>

          <span>${esc(l.direccion)}</span>

        </div>

        <a class="btn-mini" href="${esc(l.mapaUrl)}" target="_blank" rel="noopener">Cómo llegar</a>

      </div>`).join("")}

    </div>

  </section>


  <section class="review glass" aria-label="Dejar una reseña">

    <h2>¿Cómo fue tu experiencia?</h2>

    <p>Toca las estrellas y califica la atención en Google</p>

    <div class="stars" id="stars">${[1,2,3,4,5].map(n => `<button aria-label="${n} estrellas" data-n="${n}">${I.star}</button>`).join("")}</div>

    <div class="hint" id="hint"></div>

  </section>


  <footer>
    <a href="${esc(c.creditos.url)}"
       target="_blank"
       rel="noopener noreferrer">
      ${esc(c.creditos.texto)}

  </footer>`;



  [...app.children].forEach((el, i) => {
    el.classList.add("rv");
    el.style.setProperty("--i", i);
  });

  document.getElementById("guardar").onclick = guardarContacto;

  document.getElementById("compartir").onclick = compartir;

  activarEstrellas(document.getElementById("stars"));

function guardarContacto() {

  const lines = [

    "BEGIN:VCARD",
    "VERSION:3.0",

    `N:${vc(c.apellidos)};${vc(c.nombres)};;Dr.;`,

    `FN:${vc(c.doctor)}`,

    `ORG:${vc(c.nombreNegocio)}`,

    `TITLE:${vc("Cirujano Dentista · " + c.colegiatura)}`,

    `TEL;TYPE=CELL,VOICE:${c.telefono}`,

    ...c.locales.map(l => `ADR;TYPE=WORK:;;${vc(l.direccion)};;;;`),

    `URL:${location.href}`,

    "END:VCARD"

  ];


  const blob = new Blob([lines.join("\r\n")], {
    type: "text/vcard;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "Dr_Manuel_Ausejo.vcf";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 4000);

  aviso("Abre el archivo descargado para guardar el contacto");

}



async function compartir() {

  const data = {
    title: c.nombreNegocio,
    text: `${c.nombreNegocio} - ${c.doctor} (${c.colegiatura})`,
    url: location.href
  };

  try {

    if (navigator.share) {
      await navigator.share(data);
    } else {
      await navigator.clipboard.writeText(location.href);
      aviso("Enlace copiado");
    }

  } catch (e) {}

}



function activarEstrellas(box) {

  const btns = [...box.querySelectorAll("button")];

  const hint = document.getElementById("hint");

  const textos = [
    "",
    "Lamentamos eso, cuéntanos cómo mejorar",
    "Gracias, ayúdanos a mejorar",
    "Gracias por tu opinión",
    "¡Excelente! Gracias",
    "¡Muchas gracias por su preferencia!"
  ];

  btns.forEach(b => b.addEventListener("click", () => {

    const n = +b.dataset.n;

    btns.forEach((x, i) => x.classList.toggle("on", i < n));

    hint.innerHTML = `${textos[n]}<br><a href="${esc(c.resenaUrl)}" target="_blank" rel="noopener">Abrir reseña en Google</a>`;

    if (navigator.vibrate) navigator.vibrate(15);

    setTimeout(() => window.open(c.resenaUrl, "_blank", "noopener"), 700);

  }));

}



let t;

function aviso(msg) {

  const el = document.getElementById("toast");

  el.textContent = msg;
  el.classList.add("show");

  clearTimeout(t);

  t = setTimeout(() => el.classList.remove("show"), 2600);

}



const sinMovimiento = matchMedia("(prefers-reduced-motion:reduce)").matches;

let tx = 0, ty = 0, cx = 0, cy = 0, running = false;



function frame() {

  cx += (tx - cx) * 0.08;
  cy += (ty - cy) * 0.08;

  const W = innerWidth;
  const H = innerHeight;

  const max = root.scrollHeight - H;

  const p = max > 0 ? clamp(scrollY / max, 0, 1) : 0;

  const dx = cx * W * 0.07;

  const dy = clamp(-p * 0.22 * H + cy * H * 0.03, -0.27 * H, 0.04 * H);

  move.style.transform = `translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0)`;

  if (Math.abs(tx - cx) > 0.002 || Math.abs(ty - cy) > 0.002) {
    requestAnimationFrame(frame);
  } else {
    running = false;
  }

}


function kick() {

  if (!running) {
    running = true;
    requestAnimationFrame(frame);
  }

}



if (!sinMovimiento) {

  addEventListener("scroll", kick, { passive: true });

  addEventListener("resize", kick);


  addEventListener("pointermove", e => {

    if (e.pointerType !== "mouse") return;

    tx = (e.clientX / innerWidth - 0.5) * 2;

    ty = (e.clientY / innerHeight - 0.5) * 2;

    kick();

  }, { passive: true });



  const onTilt = e => {

    if (e.gamma == null || e.beta == null) return;

    tx = clamp(e.gamma / 25, -1, 1);

    ty = clamp((e.beta - 50) / 25, -1, 1);

    kick();

  };


  const D = window.DeviceOrientationEvent;

  if (D) {

    if (typeof D.requestPermission === "function") {

      addEventListener("click", () => {

        D.requestPermission().then(r => {
          if (r === "granted") {
            addEventListener("deviceorientation", onTilt);
          }
        }).catch(() => {});

      }, { once: true });

    } else {

      addEventListener("deviceorientation", onTilt);

    }

  }

}



render();
kick();

</script>
